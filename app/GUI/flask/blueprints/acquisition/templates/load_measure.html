</head>

<body>

<h2>Load a measure</h2>

<div class="settings-buttons">
    {% for f in files %}
        <button class="btn" title="{{ f }}" onclick="loadMeasure(event, '{{ f }}')">
            {{ f }}
        </button>
    {% endfor %}
</div>

<div id="loader">
    <div class="spinner"></div>
    <p>Chargement...</p>
</div>

<script>
function loadMeasure(event, filename) {

    const img = window.opener.document.getElementById("acq-figure");
    const loader = document.getElementById("loader");

    // 🔒 Active loading UI
    document.body.classList.add("loading");
    loader.style.display = "block";

    // Change texte du bouton cliqué
    event.target.innerText = "Chargement...";

    fetch("{{ url_for('acquisition.load_measure') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "filename=" + encodeURIComponent(filename)
    })
    .then(res => res.blob())
    .then(blob => {
        const url = URL.createObjectURL(blob);
        img.src = url;
        window.close();
    })
    .catch(err => {
        console.error(err);
        alert("Erreur chargement");

        // ❌ reset UI si erreur
        document.body.classList.remove("loading");
        loader.style.display = "none";
        event.target.innerText = filename;
    });
}
</script>

</body>
</html>
