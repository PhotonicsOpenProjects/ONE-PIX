<!DOCTYPE html>
<html lang="{{ current_lang }}" {% if current_theme %}data-theme="{{ current_theme }}"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}ONE-PIX{% endblock %} · ONE-PIX</title>

    <link rel="icon" href="{{ url_for('acquisition.static', filename='onepixlogo.ico') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app-shell.css') }}">

    <!-- In <head>, before any page script: pages call ONEPIX.t() /
         ONEPIX.toast() from their own scripts (some during load), and
         onepix-ui.js only defines functions, so it doesn't need the
         body to exist. -->
    <script>
        window.ONEPIX_LANG = {{ current_lang|tojson }};
        window.ONEPIX_I18N = {{ i18n_json|safe }};
    </script>
    <script src="{{ url_for('static', filename='js/onepix-ui.js') }}"></script>

    {% block head %}{% endblock %}
</head>
<body>

    <nav class="app-shell-nav">
        <a class="app-shell-brand" href="{{ url_for('acquisition.acquisition_page') }}">
            <img class="app-shell-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="ONE-PIX - home">
        </a>

        <div class="app-shell-links">
            <a class="app-shell-link {% if request.blueprint == 'acquisition' %}is-active{% endif %}"
               href="{{ url_for('acquisition.acquisition_page') }}" title="{{ t('nav.acquisition') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 8a2 2 0 0 1 2-2h2l1.2-1.8A2 2 0 0 1 9.9 3h4.2a2 2 0 0 1 1.7 1.2L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"></path>
                    <circle cx="12" cy="13" r="3.5"></circle>
                </svg>
                <span>{{ t('nav.acquisition') }}</span>
            </a>

            <a class="app-shell-link {% if request.blueprint == 'analysis' %}is-active{% endif %}"
               href="{{ url_for('analysis.analysis_page') }}" title="{{ t('nav.analysis') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 17 8 9l4 5 4-8 5 11"></path>
                </svg>
                <span>{{ t('nav.analysis') }}</span>
            </a>

            {% for page in plugin_pages %}
            <a class="app-shell-link {% if request.blueprint == page.blueprint %}is-active{% endif %}"
               href="{{ page.url }}" title="{{ t(page.label) }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    {{ page.icon|safe }}
                </svg>
                <span>{{ t(page.label) }}</span>
            </a>
            {% endfor %}

            <a class="app-shell-link {% if request.blueprint == 'data_manager' %}is-active{% endif %}"
               href="{{ url_for('data_manager.data_manager_page') }}" title="{{ t('nav.data') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>
                </svg>
                <span>{{ t('nav.data') }}</span>
            </a>

            <a class="app-shell-link {% if request.blueprint == 'plugins_manager' %}is-active{% endif %}"
               href="{{ url_for('plugins_manager.plugins_manager_page') }}" title="{{ t('nav.plugins') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 4h-4v3.5a1.5 1.5 0 0 1-3 0V4H4v4h3.5a1.5 1.5 0 0 1 0 3H4v4h3.5a1.5 1.5 0 0 1 0 3H4v2h4v-3.5a1.5 1.5 0 0 1 3 0V20h4v-4h-3.5a1.5 1.5 0 0 1 0-3H18v-2h-3.5a1.5 1.5 0 0 1 0-3H18V4h-4Z"></path>
                </svg>
                <span>{{ t('nav.plugins') }}</span>
            </a>

            <a class="app-shell-link {% if request.blueprint == 'logs' %}is-active{% endif %}"
               href="{{ url_for('logs.logs_page') }}" title="{{ t('nav.logs') }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5h16M4 10h16M4 15h10M4 20h7"></path>
                </svg>
                <span>{{ t('nav.logs') }}</span>
            </a>
        </div>

        <div class="app-shell-spacer"></div>

        <button type="button" id="themeToggle" class="app-shell-theme-toggle" aria-label="{{ t('nav.theme_toggle') }}" title="{{ t('nav.theme_toggle') }}">
            <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4.2"></circle>
                <path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.55 1.55M17.55 17.55l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.55-1.55M17.55 6.45l1.55-1.55"></path>
            </svg>
            <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path>
            </svg>
        </button>

        <div class="app-shell-lang">
            <label class="visually-hidden" for="langSelect">{{ t('nav.language') }}</label>
            <select id="langSelect" aria-label="{{ t('nav.language') }}"
                    onchange="window.location.href='{{ url_for('set_language', lang='__LANG__') }}'.replace('__LANG__', this.value)">
                {% for lang in supported_languages %}
                <option value="{{ lang }}" {% if current_lang == lang %}selected{% endif %}>{{ lang|upper }}</option>
                {% endfor %}
            </select>
        </div>
    </nav>

    <main class="app-shell-main">
        {% block app_content %}{% endblock %}
    </main>

    <div id="onepix-toast-region" aria-live="polite" aria-atomic="false"></div>

    <script>
        (function () {
            var toggle = document.getElementById("themeToggle");
            var sun = document.getElementById("themeIconSun");
            var moon = document.getElementById("themeIconMoon");

            function effectiveTheme() {
                var explicit = document.documentElement.getAttribute("data-theme");
                if (explicit === "light" || explicit === "dark") return explicit;
                return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }

            function reflectIcon(theme) {
                sun.hidden = theme === "dark";
                moon.hidden = theme !== "dark";
            }

            reflectIcon(effectiveTheme());

            toggle.addEventListener("click", function () {
                var next = effectiveTheme() === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                document.cookie = "onepix_theme=" + next + ";path=/;max-age=" + (60 * 60 * 24 * 365) + ";samesite=lax";
                reflectIcon(next);
            });
        })();
    </script>
    {% block scripts %}{% endblock %}

</body>
</html>
