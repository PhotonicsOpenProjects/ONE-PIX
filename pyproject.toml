[build-system]
requires = [
    # 77: license given as an SPDX expression (PEP 639)
    "setuptools>=77.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "onepix"
version = "3.0.0"
description = "Core module of the ONE-PIX project"

authors = [
    { name = "Mathieu Ribes" },
    { name = "Gaspard Russias" },
    { name = "Antoine Fournier" }
]

# 3.9: the oldest the dependencies still support (Flask 3.1, SciPy
# 1.13, matplotlib 3.8). No upper bound: "<=3.14" excluded 3.14.1 on.
requires-python = ">=3.9"

license = "CC-BY-NC-4.0"
license-files = ["LICENSE.md"]
readme = "README.md"

dependencies = [
    "numpy>=1.22.4,<3",
    "scikit-learn>=1.0.2,<2",
    "scipy>=1.13.1,<2",
    "matplotlib>=3.8.4,<4",

    "opencv-python",
    "imutils==0.5.4",
    "screeninfo==0.8.1",

    # >= 0.23.1: 0.22.4 writes ENVI files with ndarray.tostring(), removed from recent NumPy
    # (the ENVI export fails with NumPy 2.5); 0.23.1 and 0.24 were checked against NumPy 2.5.4
    "spectral>=0.23.1",
    # FAIR export of the data (Data manager > Export): HDF5 and TIFF stacks
    "h5py",
    "tifffile",
    "flask==3.1.3",
    # 5.3.6 crashes on every connection attempt against Flask 3.1.x
    # (AttributeError: can't set attribute 'session' in
    # flask_socketio's _handle_event) - discovered while adding
    # connect-time auth (SEC-6); 5.6.1 is the first version verified
    # working against this Flask pin.
    "flask-socketio==5.6.1",
    "orjson",

    "onepix-fis-common-function",
    "onepix-fouriersplit",
    "onepix-fouriershift",
    "onepix-stub-camera",
    "onepix-stub-spectrometer",
    "analysis-pipeline",
    "basic-treatments",
    "onepix-plugins-manager @ git+https://gitlab.com/photonics-open-projects/onepix_plugins/onepix_plugins_manager.git",

]

[project.urls]
Homepage = "https://github.com/PhotonicsOpenProjects/ONE-PIX"
Documentation = "https://one-pix.readthedocs.io/"
Issues = "https://github.com/PhotonicsOpenProjects/ONE-PIX/issues"

[project.optional-dependencies]

dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ipython",
    "jupyterlab",
    "pip-tools"
]

docs = [
    "sphinx",
    "myst-parser",
    "sphinx-autoapi"
]

# Optional analysis blueprints: not required for acquisition/reconstruction,
# soft-loaded by app/GUI/flask/run.py (a missing plugin is logged and
# skipped, never crashes app startup). Not yet published to PyPI, hence
# the direct git reference rather than a bare package name.
analysis-plugins = [
    "onepix-spectral-indices @ git+https://gitlab.com/photonics-open-projects/onepix_plugins/analysis/onepix_spectral_indices.git",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "onepix*"
]
