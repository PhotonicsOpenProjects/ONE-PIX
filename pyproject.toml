[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onepix"
version = "0.1.0"
description = "Core module of the ONE-PIX project"
authors = [{ name = "PhotonicsOpenProjects" }]
dependencies = [
    "numpy",
    "opencv-python",
    "scipy"
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["onepix*"]
